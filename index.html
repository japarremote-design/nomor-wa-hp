<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendataan Nomor WhatsApp</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#182230;font:15px Arial,sans-serif}
.wrap{max-width:1100px;margin:36px auto;padding:0 16px}.card{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:22px;box-shadow:0 5px 22px #172b4d0b}
h1{font-size:24px;margin:0 0 8px}.muted{color:#667085}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:8px;font-size:16px;margin:7px 0 14px}
button,.btn{border:0;background:#155eef;color:white;padding:11px 15px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.secondary{background:#eef4ff;color:#155eef}button:disabled{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4}th{background:#f8fafc;color:#475467}
.tablewrap{overflow:auto}.status{font-size:13px;color:#667085}.ok{color:#067647}.error{color:#b42318}
.formbox{max-width:520px;margin:8vh auto}.field{margin:18px 0}.field label{font-weight:600}
@media(max-width:600px){.card{padding:17px}.top{align-items:flex-start;flex-direction:column}h1{font-size:21px}}
</style></head>
<body><main class="wrap"><div id="app"></div></main>
<script>
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const id=params.get('id'), key=params.get('key');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function jsonFetch(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Terjadi kesalahan');return d}
if(id){
  renderPerson();
}else{
  renderAdmin();
}
async function renderPerson(){
  app.innerHTML='<section class="card formbox"><p class="muted">Memuat formulir...</p></section>';
  try{
    const d=await jsonFetch('/api/person?id='+encodeURIComponent(id));
    const p=d.person;
    app.innerHTML=`<section class="card formbox"><h1>Formulir Nomor WhatsApp/HP</h1><p class="muted">Silakan isi nomor WhatsApp/HP Anda dengan benar.</p>
    <div class="field"><label>No Daftar</label><div>${p.id}</div></div>
    <div class="field"><label>Nama Lengkap</label><div>${esc(p.name)}</div></div>
    <div class="field"><label>Jenis Kelamin</label><div>${p.gender==='L'?'Laki-laki':'Perempuan'} (${p.gender})</div></div>
    <form id="phoneForm"><div class="field"><label for="phone">No WhatsApp/HP</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Contoh: 081234567890" value="${esc(p.phone)}" required minlength="8" maxlength="20"></div>
    <button id="save" type="submit">Simpan Nomor</button> <span id="msg" class="status"></span></form></section>`;
    document.getElementById('phoneForm').addEventListener('submit',async e=>{
      e.preventDefault();const phone=document.getElementById('phone').value.trim();const btn=document.getElementById('save'),msg=document.getElementById('msg');
      if(!/^[0-9+\-\s()]{8,20}$/.test(phone)){msg.textContent='Format nomor tidak valid.';msg.className='status error';return}
      btn.disabled=true;msg.textContent='Menyimpan...';
      try{await jsonFetch('/api/person',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(id),key,phone})});msg.textContent='Nomor berhasil disimpan. Terima kasih!';msg.className='status ok'}
      catch(err){msg.textContent=err.message;msg.className='status error'}
      finally{btn.disabled=false}
    });
  }catch(e){app.innerHTML=`<section class="card formbox"><h1>Link tidak valid</h1><p class="error">${esc(e.message)}</p></section>`}
}
async function renderAdmin(){
 app.innerHTML=`<section class="card"><div class="top"><div><h1>Pendataan Nomor WhatsApp/HP</h1><p class="muted">Daftar 25 peserta dan tautan pengisian masing-masing.</p></div><button id="login">Login Admin</button></div><div id="content"><p class="muted">Login untuk melihat daftar dan membuat tautan pribadi.</p></div></section>`;
 document.getElementById('login').onclick=async()=>{
   const password=prompt('Masukkan password admin:');if(!password)return;
   try{const d=await jsonFetch('/api/admin',{headers:{'x-admin-password':password}});
     sessionStorage.setItem('adminPass',password);showTable(d.participants);
   }catch(e){alert(e.message)}
 };
 const saved=sessionStorage.getItem('adminPass');
 if(saved){try{const d=await jsonFetch('/api/admin',{headers:{'x-admin-password':saved}});showTable(d.participants)}catch(e){sessionStorage.removeItem('adminPass')}}
}
function showTable(rows){
 document.getElementById('login').textContent='Keluar';
 document.getElementById('login').onclick=()=>{sessionStorage.removeItem('adminPass');location.reload()};
 document.getElementById('content').innerHTML=`<div class="top"><span class="status">Total: ${rows.length} orang</span><button class="secondary" id="refresh">Muat Ulang</button></div><div class="tablewrap"><table><thead><tr><th>No Daftar</th><th>Nama Lengkap</th><th>L/P</th><th>No WA/HP</th><th>Link</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.gender}</td><td>${p.phone?esc(p.phone):'<span class="status">Belum diisi</span>'}</td><td><button class="secondary" data-link="${esc(p.link)}">Salin Link</button></td></tr>`).join('')}</tbody></table></div><p class="status">Bagikan setiap link hanya kepada orang yang namanya sesuai.</p>`;
 document.getElementById('refresh').onclick=async()=>{try{const d=await jsonFetch('/api/admin',{headers:{'x-admin-password':sessionStorage.getItem('adminPass')}});showTable(d.participants)}catch(e){alert(e.message)}};
 document.querySelectorAll('[data-link]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.link);b.textContent='Tersalin!';setTimeout(()=>b.textContent='Salin Link',1500)}catch(e){prompt('Salin tautan ini:',b.dataset.link)}});
}
</script></body></html>
